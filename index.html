<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stock animation</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body data-state="loading">
    <div class="app">
      <header class="bar">
        <p class="mark">Stock animation</p>
        <div class="ask">
          <form id="form">
            <label for="ticker">Ticker</label>
            <input
              id="ticker"
              name="ticker"
              value="NVDA"
              autocomplete="off"
              spellcheck="false"
              placeholder="NVDA, AAPL, 0700.HK"
              aria-describedby="cue"
            />
            <button id="play" type="submit">Play</button>
          </form>
          <p id="cue" class="cue">Enter a ticker (NVDA, AAPL, 0700.HK) and press Play.</p>
        </div>
        <div class="save">
          <button id="replay" type="button" hidden>Replay</button>
          <button id="download" type="button" hidden>Download MP4</button>
        </div>
      </header>
      <canvas id="stage" width="1920" height="1080"></canvas>
      <p id="status" role="status">Loading NVDA…</p>
      <footer class="colophon">
        <a href="https://www.linkedin.com/in/keithlihk">Created by Keith Li · Follow me on LinkedIn</a>
        <span class="sep" aria-hidden="true">·</span>
        <a href="https://github.com/keithligh/stock-animation">Source on GitHub</a>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
