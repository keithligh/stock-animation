<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stock animation</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body data-state="empty">
    <div class="app">
      <header class="bar">
        <p class="mark">Stock animation</p>
        <form id="form">
          <label for="ticker">Ticker</label>
          <input id="ticker" name="ticker" autocomplete="off" spellcheck="false" placeholder="NVDA, AAPL, 0700.HK" />
          <button id="play" type="submit">Play</button>
        </form>
        <div class="save">
          <button id="download" type="button" hidden>Download MP4</button>
        </div>
      </header>
      <canvas id="stage" width="1920" height="1080"></canvas>
      <p id="status" role="status">Type a ticker and press Play.</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
